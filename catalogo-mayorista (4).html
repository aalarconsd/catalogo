<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Mayorista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f7f2eb;--paper:#fffdf9;--ink:#2b241f;--mute:#8a7b6e;--tan:#b38a66;--tan-d:#8f6a4a;--line:#e6dccf}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* cover */
.cover{display:grid;grid-template-columns:1fr 1.1fr;background:var(--paper);border-bottom:1px solid var(--line);min-height:78vh}
.cover-txt{padding:clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.issue{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--ink);padding-bottom:12px}
.cover h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(52px,8vw,120px);line-height:.9;letter-spacing:-.02em}
.cover h1 em{color:var(--tan)}
.lede{max-width:36ch;font-size:17px;line-height:1.55;color:#5a4d42;margin-top:20px}
.stats{display:flex;gap:36px;border-top:1px solid var(--line);padding-top:20px}
.stats b{display:block;font-family:'Bodoni Moda',serif;font-weight:400;font-size:40px;line-height:1}
.stats span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.collage{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;background:var(--paper)}
.collage div{overflow:hidden;background:#efe8df}
.collage div:first-child{grid-row:span 2}
.collage img{width:100%;height:100%;object-fit:cover}

/* bar */
.bar{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--line)}
.bar-top{max-width:1360px;margin:0 auto;padding:12px clamp(14px,3vw,32px) 8px;display:flex;gap:14px;align-items:center}
.brand{font-family:'Bodoni Moda',serif;font-size:21px;margin-right:auto;white-space:nowrap;cursor:pointer}
.brand i{color:var(--tan)}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 14px;flex:0 1 300px}
.search input{border:0;outline:0;background:none;font:inherit;font-size:14px;width:100%}
.cats{max-width:1360px;margin:0 auto;padding:4px clamp(14px,3vw,32px) 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:none;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--paper);white-space:nowrap}
.chip:hover{border-color:var(--tan)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{color:var(--mute);margin-left:4px}
.chip[aria-pressed=true] small{color:#cbbfb3}

main{max-width:1360px;margin:0 auto;padding:0 clamp(14px,3vw,32px) 120px;min-height:60vh}

/* index */
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:56px 0 18px;display:flex;align-items:center;gap:14px}
.kicker::after{content:"";flex:1;height:1px;background:var(--line)}
.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--paper);text-align:left;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(60,40,20,.45)}
.tile .ph{aspect-ratio:4/3;overflow:hidden;background:#efe8df}
.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .t{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px}
.tile .t strong{font-family:'Bodoni Moda',serif;font-weight:400;font-size:20px;line-height:1.1}
.tile .t span{font-size:12px;color:var(--mute);white-space:nowrap;margin-left:8px}
.tile .par{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tan-d);margin-bottom:2px}

/* section */
.sec-head{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:end;padding:56px 0 22px;border-bottom:1px solid var(--ink);margin-bottom:26px}
.sec-head .num{font-family:'Bodoni Moda',serif;font-style:italic;font-size:76px;line-height:.8;color:var(--tan)}
.sec-head h2{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(34px,5vw,60px);line-height:.95}
.sec-head .par{display:block;font-family:'DM Sans';font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--tan-d);margin-bottom:8px}
.sec-head .meta{text-align:right;font-size:13px;color:var(--mute)}
.sec-head .meta strong{display:block;color:var(--ink);font-size:15px}
.more{display:block;margin:30px auto 0;padding:13px 28px;border-radius:999px;border:1px solid var(--ink);font-weight:600}
.more:hover{background:var(--ink);color:var(--paper)}

.grid{display:grid;grid-auto-flow:dense;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.5vw,20px)}
.card{grid-column:span 2;background:var(--paper);position:relative;cursor:zoom-in;transition:transform .25s,box-shadow .25s}
.card.w3{grid-column:span 3}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(60,40,20,.45)}
.card .ph{aspect-ratio:1;overflow:hidden;background:#efe8df}
.card .ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .6s}
.card .ph img.ld{opacity:1}
.card:hover .ph img{transform:scale(1.04)}
.card .cap{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px 13px;gap:8px}
.card .code{font-family:'Bodoni Moda',serif;font-size:18px}
.card .cat{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dense .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.dense .card,.dense .card.w3{grid-column:auto}
.dense .card .code{font-size:15px}
.empty{padding:80px 0;text-align:center;color:var(--mute);font-family:'Bodoni Moda',serif;font-size:24px;font-style:italic}
.viewtog{display:flex;gap:6px;justify-content:flex-end;margin-top:-10px;margin-bottom:18px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(30,24,20,.94);display:none;align-items:center;justify-content:center}
.lb.open{display:flex}
.lb figure{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-width:1120px;width:94vw;max-height:90vh;background:var(--paper)}
.lbimg{background:#efe8df;display:flex;align-items:center;justify-content:center;min-height:50vh}
.lbimg img{max-height:90vh;width:100%;object-fit:contain}
.lb figcaption{padding:30px 26px;display:flex;flex-direction:column;gap:10px}
.k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.bigcode{font-family:'Bodoni Moda',serif;font-size:42px;line-height:1}
.lb .drive{font-size:13px;color:var(--tan-d)}
.lb .x,.lb .nav{position:fixed;color:#fff;font-size:28px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1)}
.lb .x{top:18px;right:18px}
.lb .nav.p{left:18px;top:50%;transform:translateY(-50%)}
.lb .nav.n{right:18px;top:50%;transform:translateY(-50%)}

footer.end{max-width:1360px;margin:0 auto;padding:40px clamp(14px,3vw,32px) 60px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mute);font-size:13px}

@media (max-width:860px){
  .cover{grid-template-columns:1fr;min-height:auto}
  .collage{order:-1;aspect-ratio:4/3}
  .stats{gap:22px}.stats b{font-size:30px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .card,.card.w3{grid-column:span 1}
  .card.m2{grid-column:span 2}
  .brand{display:none}
  .search{flex:1}
  .sec-head{grid-template-columns:auto 1fr}
  .sec-head .meta{grid-column:1/-1;text-align:left}
  .sec-head .num{font-size:54px}
  .toc{grid-template-columns:repeat(2,1fr);gap:10px}
  .tile .t{flex-direction:column;gap:4px}
  .tile .t strong{font-size:17px}
  .tile .t span{margin:0}
  .lb figure{grid-template-columns:1fr;overflow:auto}
  .lb figcaption{padding:18px}
  .lb .nav{top:auto;bottom:18px;transform:none}
  .dense .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header class="cover" id="cover">
  <div class="cover-txt">
    <div class="issue"><span>Catálogo mayorista</span><span>Edición 2026</span></div>
    <div>
      <h1>Brillo<br><em>al por mayor</em></h1>
      <p class="lede">Aretes, topos, cadenas, pulseras, sets y más. Elige una categoría, toca una pieza para verla en grande con todos sus detalles.</p>
    </div>
    <div class="stats"><div><b id="stTotal"></b><span>piezas</span></div><div><b id="stCats"></b><span>categorías</span></div><div><b id="stNew"></b><span>nuevas</span></div></div>
  </div>
  <div class="collage" id="collage"></div>
</header>

<div class="bar">
  <div class="bar-top">
    <div class="brand" id="home">Catálogo <i>Mayorista</i></div>
    <label class="search">⌕<input id="q" type="search" placeholder="Buscar por código (ej. SR2741)" autocomplete="off"></label>
  </div>
  <nav class="cats" id="cats"></nav>
</div>

<main id="main"></main>
<footer class="end"><span>Catálogo Mayorista</span><span>Fotos cargadas desde Google Drive</span></footer>

<div class="lb" id="lb">
  <button class="x" id="lbx" aria-label="Cerrar">×</button>
  <button class="nav p" id="lbp" aria-label="Anterior">‹</button>
  <button class="nav n" id="lbn" aria-label="Siguiente">›</button>
  <figure>
    <div class="lbimg"><img id="lbimg" referrerpolicy="no-referrer" alt=""></div>
    <figcaption>
      <div class="k" id="lbcat"></div>
      <div class="bigcode" id="lbcode"></div>
      <div class="k" style="margin-top:6px">El precio está en la etiqueta de la foto</div>
      <div class="k" id="lbpos" style="margin-top:12px"></div>
      <a class="drive" id="lbdrive" target="_blank" rel="noopener">Ver original en Drive ↗</a>
    </figcaption>
  </figure>
</div>

"],["1f6HYTZfobC9uXCm4EBxQXLcb8l3XZ_ZL","TP034"],["1mI7KknKpks4Jt9N1dRBSK2txjR-izmnO","TP038"],["1x_EwoqteyZZMoj0FnNA8eBJ1Blr6siD2","TP040"],["1fHzKcvs8ihy9ki7OXFTtFuLfHymFNrcq","TP041"]]}];
// flatten
const ALL = []; const BY = {};
CATS.forEach((c,ci)=>{ c.idx=ci; c.items = c.i.map(([id,code])=>{ const it={id,code,ci}; ALL.push(it); BY[id]=it; return it; }); });
const $ = id=>document.getElementById(id);
const src = (id,w)=>`https://lh3.googleusercontent.com/d/${id}=w${w}`;
const alt = (id,w)=>`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
window.imgErr = function(el){ if(!el.dataset.f){ el.dataset.f=1; el.src=alt(el.dataset.id, el.dataset.w); } else { el.classList.add('ld'); el.style.opacity=.25; } };
const img = (id,w,cls='')=>`<img referrerpolicy="no-referrer" loading="lazy" decoding="async" class="${cls}" data-id="${id}" data-w="${w}" src="${src(id,w)}" onload="this.classList.add('ld')" onerror="imgErr(this)" alt="">`;
const label = it => it.code || 'Ref. en foto';
const catName = c => (c.p? c.p+' · ':'')+c.n;

let view={type:'home'}, visible=[], shown=0, dense=false;
const PAGE=48;

// cover
$('stTotal').textContent=ALL.length.toLocaleString('es-CO');
$('stCats').textContent=CATS.length;
const nuevo = CATS.find(c=>c.n==='Nuevo') || CATS[0];
$('stNew').textContent=nuevo.items.length;
$('collage').innerHTML = [0,1,2].map(i=>`<div>${img((nuevo.items[i*7]||nuevo.items[0]).id, i?700:1100)}</div>`).join('');

// chips
function renderChips(){
  const act = view.type==='cat'? view.ci : (view.type==='home'?'home':null);
  $('cats').innerHTML = `<button class="chip" data-c="home" aria-pressed="${act==='home'}">Todo</button>` +
    CATS.map(c=>`<button class="chip" data-c="${c.idx}" aria-pressed="${act===c.idx}">${c.n}<small>${c.items.length}</small></button>`).join('');
  const a=$('cats').querySelector('[aria-pressed=true]'); if(a) a.scrollIntoView({inline:'center',block:'nearest'});
}
$('cats').onclick=e=>{const b=e.target.closest('.chip'); if(!b) return; $('q').value=''; go(b.dataset.c==='home'?{type:'home'}:{type:'cat',ci:+b.dataset.c});};
$('home').onclick=()=>{$('q').value='';go({type:'home'});};
let qt; $('q').oninput=()=>{clearTimeout(qt); qt=setTimeout(()=>{const v=$('q').value.trim().toUpperCase(); go(v?{type:'search',q:v}:{type:'home'},true);},180);};

function go(v, keepScroll){
  view=v; renderChips(); render();
  if(!keepScroll){ const top=document.querySelector('.bar').offsetTop; if(window.scrollY>top) window.scrollTo({top}); }
  try{ history.replaceState(null,'', v.type==='cat'?'#c'+v.ci:' '); }catch(e){}
}

function card(it,i,showCat){
  return `<article class="card ${i%5<2?'w3':''} ${i%5===0?'m2':''}" data-id="${it.id}">
    <div class="ph">${img(it.id, i%5<2?900:600)}</div>
    <div class="cap"><span class="code">${label(it)}</span>${showCat?`<span class="cat">${CATS[it.ci].n}</span>`:''}</div>
  </article>`;
}

function render(){
  const m=$('main');
  document.body.classList.toggle('dense', dense && view.type!=='home');
  if(view.type==='home'){
    visible=[];
    const tile=c=>`<button class="tile" data-go="${c.idx}"><div class="ph">${img(c.items[0].id,500)}</div><div class="t"><div>${c.p?`<span class="par">${c.p}</span>`:''}<strong>${c.n}</strong></div><span>${c.items.length} piezas</span></div></button>`;
    m.innerHTML = `<div class="kicker">Destacados y novedades</div><div class="toc">${CATS.filter(c=>c.f).map(tile).join('')}</div>
      <div class="kicker">Todas las categorías</div><div class="toc">${CATS.filter(c=>!c.f).map(tile).join('')}</div>`;
    return;
  }
  let title, par='', list, num='';
  if(view.type==='cat'){ const c=CATS[view.ci]; title=c.n; par=c.p; list=c.items; num=String(view.ci+1).padStart(2,'0'); }
  else { list=ALL.filter(it=>it.code.includes(view.q)); title='“'+view.q+'”'; num='⌕'; }
  visible=list; shown=0;
  m.innerHTML = `<div class="sec-head"><span class="num">${num}</span><h2>${par?`<span class="par">${par}</span>`:''}${title}</h2><div class="meta"><strong>${list.length} piezas</strong>${view.type==='search'?'Resultado de búsqueda':'El precio está en cada foto'}</div></div>
    <div class="viewtog"><button class="chip" id="vMag" aria-pressed="${!dense}">Revista</button><button class="chip" id="vDen" aria-pressed="${dense}">Compacta</button></div>
    <div class="grid" id="grid"></div><button class="more" id="more" hidden></button>`;
  if(!list.length){ $('grid').outerHTML='<div class="empty">No hay piezas con ese código.</div>'; }
  $('vMag').onclick=()=>{dense=false;render();}; $('vDen').onclick=()=>{dense=true;render();};
  $('more').onclick=more; more();
}
function more(){
  const g=$('grid'); if(!g) return;
  const next=visible.slice(shown, shown+PAGE);
  g.insertAdjacentHTML('beforeend', next.map((it,k)=>card(it,shown+k,view.type==='search')).join(''));
  shown+=next.length;
  const b=$('more'); b.hidden = shown>=visible.length; b.textContent=`Ver más (${visible.length-shown} restantes)`;
}
// auto-load more near bottom
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting && !$('more')?.hidden) more(); }),{rootMargin:'800px'});
new MutationObserver(()=>{const b=$('more'); if(b && !b._o){b._o=1; io.observe(b);}}).observe($('main'),{childList:true});

$('main').onclick=e=>{
  const t=e.target.closest('[data-go]'); if(t){ go({type:'cat',ci:+t.dataset.go}); return; }
  const c=e.target.closest('.card'); if(c) openLb(visible.findIndex(it=>it.id===c.dataset.id));
};


// lightbox
let li=0;
function openLb(i){ if(i<0) return; li=i; showLb(); $('lb').classList.add('open'); }
function showLb(){
  const it=visible[li]; const im=$('lbimg');
  im.dataset.f=''; im.dataset.id=it.id; im.dataset.w=1600; im.onerror=()=>imgErr(im); im.src=src(it.id,1600);
  $('lbcat').textContent=catName(CATS[it.ci]); $('lbcode').textContent=label(it);
  $('lbpos').textContent=(li+1)+' de '+visible.length;
  $('lbdrive').href='https://drive.google.com/file/d/'+it.id+'/view';
  [li-1,li+1].forEach(j=>{ if(visible[j]) new Image().src=src(visible[j].id,1600); });
}
const closeLb=()=>$('lb').classList.remove('open');
$('lbx').onclick=closeLb; $('lb').onclick=e=>{if(e.target===$('lb')) closeLb();};
$('lbp').onclick=()=>{li=(li-1+visible.length)%visible.length; showLb();};
$('lbn').onclick=()=>{li=(li+1)%visible.length; showLb();};
document.addEventListener('keydown',e=>{
  if($('lb').classList.contains('open')){ if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') $('lbp').onclick(); if(e.key==='ArrowRight') $('lbn').onclick(); }
});
let tx=null; $('lb').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('lb').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) (dx>0?$('lbp'):$('lbn')).onclick(); tx=null; });


// start
const h=location.hash.match(/^#c(\d+)$/);
go(h && CATS[+h[1]] ? {type:'cat',ci:+h[1]} : {type:'home'}, true);
</script>
